<body>
<header class="top">
  <span class="brand">Resonance Battle Companion</span>
  <div id="save" class="save">
    <label class="load"><input type="file" id="pick" accept=".sav"><span>Load your save</span></label>
    <span class="dim" id="save-hint">to plan with what you own</span>
  </div>
</header>
<p id="error" class="error" role="alert" hidden></p>
<main id="app"><p class="dim loading">Loading game data…</p></main>
<div id="toast" class="toast window" role="status" aria-live="polite" hidden></div>
<dialog id="about" class="window" aria-label="How it works">
  <div id="about-body"></div>
  <form method="dialog"><button class="primary">Close</button></form>
</dialog>
<footer class="foot">
  <p><button type="button" class="ghost" id="how">How it works</button> · Fan-made, not affiliated with Square Enix · Your save never leaves this tab · <a href="https://github.com/DylanElo/ffr-battle-companion">Source</a></p>
</footer>
</body>
</html>
