<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resonance Battle Companion</title>
<meta name="description" content="Boss weaknesses, gear planning and Resonance kits for FINAL FANTASY RESONANCE. Load your save to plan with what you own; it never leaves your computer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="optimizer.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' rx='3' fill='%23233a96' stroke='%23e9ecf8' stroke-width='1.5'/%3E%3Cpath d='M8 4l3 4-3 4-3-4z' fill='%23ffd75e'/%3E%3C/svg%3E">
<script src="core.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<header class="top">
  <span class="brand">Resonance Battle Companion</span>
  <div id="save" class="save">
    <label class="load"><input type="file" id="pick" accept=".sav"><span>Load your save</span></label>
    <span class="dim" id="save-hint">to plan with what you own</span>
  </div>
</header>
<p id="error" class="error" role="alert" hidden></p>
<main id="app"><p class="dim loading">Loading game data…</p></main>
<div id="toast" class="toast window" role="status" aria-live="polite" hidden></div>
<footer class="foot">
  <p>Unofficial fan tool. Not affiliated with or endorsed by Square Enix. Your save is read in this tab and never uploaded. <a href="https://github.com/DylanElo/ffr-battle-companion">Source on GitHub</a>.</p>
</footer>
</body>
</html>
